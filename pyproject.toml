[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quac"
version = "1.0.0"
description = "Quac — Serverless Quantum Simulation Model-as-a-Service (MaaS) API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".terraform", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # pyupgrade
    "B",     # bugbear (common footguns)
    "BLE",   # blind except (paired with explicit noqa where intentional)
    "SIM",   # simplify
    "C4",    # comprehensions
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Test modules importorskip before other imports by necessity (E402),
# and fixtures intentionally reach into limiter internals.
"tests/*" = ["E402", "SLF001", "B011"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
# Quac deploys exclusively to Linux (Lambda container + Fargate); target the
# production platform so POSIX-only APIs (signal.SIGALRM, setitimer) typecheck.
platform = "linux"
files = ["api", "worker"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:api.*",
    "error::DeprecationWarning:worker.*",
]
