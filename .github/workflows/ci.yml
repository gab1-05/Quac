# =============================================================================
# Quac CI — quality gate, IaC validation, web build, and a full local e2e run.
#
# Jobs
#   quality   ruff + mypy + pytest against the pinned production dependency set
#   terraform fmt -check, init -backend=false, validate (no AWS credentials)
#   web       npm ci + tsc -b + vite build for the console in web/
#   e2e       boots the docker-compose LocalStack stack, provisions the mirrored
#             resources, and drives API -> SQS -> worker -> S3 -> webhook with
#             scripts/e2e.py (also proves both container images build & boot)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            worker/requirements.txt

      - name: Install production dependencies + toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r worker/requirements.txt
          pip install ruff mypy pytest

      - name: Ruff
        run: ruff check api core worker tests scripts

      - name: Gitleaks (secret scan)
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            GL_VERSION=8.30.1
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks dir . --redact --config .gitleaks.toml --verbose

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -v

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialise (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  web:
    name: Web console build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  security:
    name: Trivy scan (vuln, misconfig, secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Trivy filesystem scan
        # Vuln DB lives in the Actions runner's fast network; misconfig +
        # secret scanners cover Dockerfiles, compose, and IaC in the same pass.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          # .terraform: provider binaries, validated by the terraform job.
          # web/node_modules + web/dist: vendored npm deps and their build
          # output; the web job pins and rebuilds them from package-lock.json.
          skip-dirs: .terraform,web/node_modules,web/dist
          trivyignores: .trivyignore

  e2e:
    name: Local end-to-end (LocalStack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Deterministic poll budget for CI runners (image pulls dominate startup).
      QUAC_E2E_POLL_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v5

      - name: Build images and start the stack
        # --wait blocks on the localstack healthcheck and the api HEALTHCHECK.
        # init is NOT listed: it is a one-shot service (exits 0 when done) that
        # --wait would misreport as unhealthy; worker's depends_on
        # "service_completed_successfully" runs and awaits it instead.
        run: docker compose up -d --build --wait localstack api worker webhook

      - name: Drive API -> queue -> worker -> S3 -> webhook
        run: docker compose run --rm e2e

      - name: Stack logs
        if: always()
        run: docker compose logs --no-color --timestamps
